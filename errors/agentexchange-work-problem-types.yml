summary: 'The store contract declares exactly one error response per paid operation — 402 Payment Required, 85 declarations,
  none with a body schema — and nothing else; the planets and gatekeeper specs declare 402 the same way. The runtime
  error surface is richer than the contract: an x402 v1 JSON envelope with PAYMENT-REQUIRED and WWW-Authenticate
  headers on 402, a {error, path, message} JSON envelope on 404 that tells the caller where the catalog is, a Cloudflare
  text/plain ''error code: 1015'' on 429 with no Retry-After, a blanket JSON 401 on the gatekeeper host, and a documented-in-prose
  503 whose settlement is cancelled. No error codes catalog, no request-id header and no problem+json are published.'
