apis:
- aid: agentexchange-work:mcp-server
  name: Agent Exchange MCP Server
  description: >-
    Remote Model Context Protocol server at https://store.agentexchange.work/mcp (Streamable HTTP; a GET
    returns a JSON hint, POST carries JSON-RPC 2.0). initialize answers anonymously with protocolVersion
    2025-06-18 and serverInfo {name: riley-x402-agent-store, version: 1.0.0}; tools/list answers anonymously
    with 92 tools, each carrying a real inputSchema. Two tools (store_catalog, store_samples) and the
    four free Clearing House tools cost nothing; the paid tools return x402 payment requirements on first
    call and are retried with the signed payload in an x_payment argument. No OAuth: /.well-known/oauth-protected-resource
    on the MCP host answers 404 with a JSON body stating "This MCP server does not use OAuth" and pointing
    at /.well-known/mcp.json, the provider's own MCP descriptor (endpoint, transports, protocol versions,
    install snippets for Claude Desktop and Cursor, and an npx mcp-remote stdio bridge). Planets runs
    a second MCP server at https://planets.agentexchange.work/mcp with 12 tools; both are catalogued in
    mcp/.
  humanURL: https://store.agentexchange.work/.well-known/mcp.json
  baseURL: https://store.agentexchange.work/mcp
  tags:
  - MCP
  - Agent-Native
  - x402
  tags_raw:
  - MCP
  - agent-native
  - x402
