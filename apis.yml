- aid: agentexchange-work:gatekeeper-oracle
  name: Gatekeeper Oracle
  description: >-
    A pay-per-question oracle served at https://agentexchange.work/oracle and https://gatekeeper.agentexchange.work/oracle:
    GET /oracle?q=… or POST /oracle {"question"} costs $0.05 in USDC on Base via x402 (v1 X-PAYMENT and v2
    PAYMENT-SIGNATURE clients both supported) and GET /oracle/info returns the price, payTo address, network
    and payment instructions for free. Described by an OpenAPI 3.1.0 document (info.title "Gatekeeper Oracle",
    3 operations with operationIds askOracleGet, askOraclePost, oracleInfo) served byte-identically from both
    hosts, and by an x402 catalog at /.well-known/x402 on both. The contract states that if every backing model
    fails the route returns 503 and settlement is cancelled, so a caller is not charged for a failed answer.
  humanURL: https://gatekeeper.agentexchange.work/oracle/info
  baseURL: https://gatekeeper.agentexchange.work
  tags:
  - Agents
  - x402
  - AI
  properties:
  - type: OpenAPI
    url: openapi/agentexchange-work-gatekeeper-oracle-openapi.json
  - type: OpenAPI
    name: Gatekeeper Oracle OpenAPI 3.1 (provider-hosted)
    url: https://agentexchange.work/openapi.json
  - type: Overlay
