apis:
- aid: agentexchange-work:api-store
  name: Agent Exchange API Store
  description: >-
    The pay-per-call data API for AI agents at https://store.agentexchange.work: an OpenAPI 3.1.0 document
    (info.version 1.2.0, servers[] https://store.agentexchange.work) describing 86 operations — 66 GET and 20
    POST — with a unique operationId on each, an x-payment-info price block on the 85 paid routes, query
    parameters on 62 operations and an inline 200 response schema on all 86. There are no accounts and no API
    keys by default: an unpaid call to a paid route returns HTTP 402 with an x402 challenge (body envelope plus
    PAYMENT-REQUIRED and WWW-Authenticate headers), the caller signs a USDC authorization on Base or Solana and
    retries with X-PAYMENT (v1) or PAYMENT-SIGNATURE (v2). Prices run $0.001–$19 per call and are quoted
    authoritatively in /.well-known/x402; a card-bought API key (Authorization: Bearer or X-API-Key) unlocks
    the same routes over plain HTTPS. Free surfaces: GET /score (AI-visibility score, no key), GET /samples
    (illustrative snapshots of every paid product), GET /docs, /api-docs, /status, /health and /v1/models.
  humanURL: https://store.agentexchange.work/
  baseURL: https://store.agentexchange.work
  tags:
  - Agents
  - x402
  - AI Visibility
  - On-Chain Data
  - Crypto
  - Web Search
  - Prediction Markets
  - DeFi
  - Macroeconomics
  - Public Procurement
  properties:
