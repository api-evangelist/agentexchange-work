source: >-
  Live GET probes, 2026-09-19, of the named /.well-known/* path list on every host this record knows — the
  registrable domain agentexchange.work (www.agentexchange.work does not resolve), the API Store host
  store.agentexchange.work (also the primary MCP host), exchange.agentexchange.work, planets.agentexchange.work
  (the second MCP host and the A2A JSON-RPC host), gatekeeper.agentexchange.work (the oracle's second
  OpenAPI servers[] host) and try.agentexchange.work (the terms/privacy host) — plus the extra discovery
  documents the provider's own status page, api-catalog linkset, ai-plugin and agent cards name (x402
  catalog, mcp.json, usd.json, registration.json, jwks.json). Every row below is a request that was actually
  issued; every status is the one returned; a body was saved only where the response was a real,
  correctly-typed document. A negative-control path that cannot exist was issued on every host.
summary:
  hosts_probed: 6
  documents_served: 16
  hit_count: 16
  path_echo_control: passed
  note: >-
    The store host serves the complete discovery layer: an RFC 9116 security.txt (Contact, Expires 2027-07-01,
    Canonical, Preferred-Languages, Policy), an RFC 9727 api-catalog linkset (served as application/json rather
    than application/linkset+json; describedby → x402 catalog, usd.json and billing/catalog.json, service-desc →
    openapi.json typed application/vnd.oai.openapi+json), an OpenAI-style ai-plugin.json pointing at the
    OpenAPI, an A2A agent card at both card paths, the provider's own MCP descriptor at /.well-known/mcp.json
    (endpoint, transports, protocol versions, install snippets, 92 tools with prices), an x402 v1 catalog of 85
    resources, a USD offers document and an ERC-8004 registration. It serves NO OpenID/OAuth discovery and no
    RFC 9728 protected-resource metadata for its MCP server — /.well-known/oauth-protected-resource answers 404
    with a JSON body that says so explicitly ("This MCP server does not use OAuth … Connect to
    https://store.agentexchange.work/mcp with no credentials"), which is recorded as the honest absence it is.
    The apex serves an ai-plugin.json, the Clearing House's legacy agent.json and the Gatekeeper x402 catalog.
    planets serves a security.txt (Contact + Canonical + Preferred-Languages, NO Expires — not RFC 9116
    conformant), an A2A card at both card paths and again at /.well-known/mcp.json, an x402 catalog and a JWKS.
    gatekeeper answers HTTP 401 for every /.well-known/ path except /.well-known/x402 (and for the negative
    control), so its rows are recorded as 401 and nothing is credited there beyond the x402 catalog. Misses are
    real: apex/exchange return a 9-byte "Not found" 404, store a JSON not_found envelope, planets a 44-byte JSON
    404, try a 342-byte HTML 404 — and the negative control returned non-2xx on all six hosts.
