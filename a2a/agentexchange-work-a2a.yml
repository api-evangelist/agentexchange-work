summary: >-
  Agent Exchange serves THREE A2A agent cards from its own hosts, and this manifest grades the provider on
  the strongest of them — the Agent Planets card — because it is the only one of the three whose declared
  endpoint is a live A2A JSON-RPC responder. The Agent Planets card sits at the canonical
  /.well-known/agent-card.json on planets.agentexchange.work (protocolVersion 1.0, preferredTransport JSONRPC
  at https://planets.agentexchange.work/a2a, twelve skills, an EdDSA signature with a published JWKS, and the
  google-agentic-commerce a2a-x402 extension declared) and grades conformant. The API Store card at the
  canonical path on store.agentexchange.work (protocolVersion 0.3.0, 25 skills) grades near-conformant: it
  omits preferredTransport and its url is the REST base — POST /a2a on that host is a 404 — so it is a
  discovery card over a REST/MCP/x402 store rather than an A2A endpoint. The Clearing House card sits at the
  legacy /.well-known/agent.json on exchange.agentexchange.work and the apex (protocolVersion 0.3.0, four
  skills) and grades near-conformant. Every card was fetched with HTTP 200 and application/json, every host
  passed a negative-control probe (a /.well-known/ path that cannot exist returned 404), and ownership is
  settled by the documents themselves: the Planets card's provider block is {organization: Agent Exchange, url:
  https://agentexchange.work}, the Store card's is {organization: RileyCraig14, url: https://agentexchange.work}
  — Riley Craig is the operator the company homepage names — and every OpenAPI on these hosts declares
  servers[] on the same host it is fetched from.
