summary: >-
  There is no sandbox in the test-mode sense: no test keys, no test network, no test wallet and no
  time simulation — every paid call settles real USDC on Base mainnet (eip155:8453) or Solana mainnet
  through the Coinbase CDP facilitator. What the provider publishes instead is a "try before you pay" layer:
  GET /samples returns illustrative snapshots of every paid product, each with the exact x402 call that buys
  the live version, and the provider states plainly that "Free samples below are illustrative snapshots. Paid
  calls return LIVE data." A handful of free live routes let an agent exercise the real request path without
  paying — GET /score (the flagship AI-visibility score, keyless and CORS-enabled), GET /v1/models, the
  Clearing House browse/register/bid routes, and on planets POST /api/claim, GET /pulse, GET /api/planets.
  An unpaid GET of any paid route is itself a safe rehearsal: it returns the 402 envelope with the exact price,
  payTo and asset and settles nothing. No dry-run flag, ?trial= parameter or test-mode header exists.
test_vs_live:
  separation: none — one environment, mainnet settlement
  test_keys: none (there are no keys by default; the card-bought ak_ key is live)
  test_network: none — x402 requirements name eip155:8453 (Base mainnet) and solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp (Solana mainnet)
  time_simulation: none
