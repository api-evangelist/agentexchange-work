summary: >-
  Agent Exchange's conformance profile is the agent-commerce and agent-discovery protocol stack, and most of
  it is verifiable from outside: a live x402 402 envelope observed on a real paid route (v1 body, v2 headers),
  an A2A card graded conformant on planets and near-conformant on the store, two MCP servers at protocol
  2025-06-18 answering anonymous tools/list, an RFC 9727 api-catalog linkset (wrong media type), an RFC 9116
  security.txt on the store (a non-conformant one on planets), an OpenAI ai-plugin manifest, an ERC-8004
  registration, an llms.txt on six hosts, and a robots.txt Content-Signal declaration. Inside its own market
  the contract declares three interoperability signatures: an OpenAI-compatible chat-completions shape at
  POST /v1/chat/completions (plus Anthropic-, Ollama-, Vertex-, Bedrock- and Agentforce-shaped proxy routes),
  a Tavily-compatible search body at POST /search, and Ethereum JSON-RPC method semantics (eth_chainId,
  eth_call, eth_getStorageAt, eth_feeHistory …) wrapped as REST under /chain/*. It declares no OAuth/OIDC, no
  RFC 9457 problem details, no RFC 8594 sunset signalling, no Idempotency-Key and no pagination standard.
standards:
- id: x402
  name: x402 HTTP payment protocol
  version: '1 (body) / 2 (headers)'
  conforms: true
  verification: observed
  evidence: >-
    GET https://store.agentexchange.work/chain/gas?chain=base with no payment returned HTTP 402,
    application/json, body {x402Version: 1, error: "Payment required", accepts: [{scheme: exact, network: base,
    maxAmountRequired: "20000", asset: 0x8335…2913, payTo: 0xc91c…b95c, maxTimeoutSeconds: 300, outputSchema}],
    resource {url, description, serviceName, tags}, extensions.bazaar}, plus headers PAYMENT-REQUIRED (base64
    x402 v2 envelope) and WWW-Authenticate: MPP <envelope>. The provider also serves /.well-known/x402 (85
    resources, accepts[] on base and solana) and every paid operation declares responses.402 and x-payment-info
    {price {mode fixed, currency USD, amount}, protocols [{x402}, {mpp}]}.
  note: The paid retry was not exercised (it requires spending USDC). The mpp protocol entry and the MPP WWW-Authenticate scheme are the provider's own labels and are recorded, not verified against a specification.
  domain_standard_signature: true
