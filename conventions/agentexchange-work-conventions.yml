reversibility:
  grade: none
  docs: https://store.agentexchange.work/llms.txt
  note: >-
    No reversal operation exists anywhere on the surface — no cancel, refund, void, delete, undo or restore
    route in the store OpenAPI (86 operations), the planets OpenAPI (6) or the oracle OpenAPI (3), and none
    in the 92 store MCP tools or 12 planets tools. The provider states no reversal window for any write. What
    it does state, verbatim, is on the payment side: the Gatekeeper Oracle "returns 503 and settlement is
    cancelled, so a caller is never charged for silence" (a failed call is not settled — that is not a
    reversal of a completed one), and the human reports carry a "30-day refund" / "30-day money-back
    guarantee" (try.agentexchange.work llms.txt and terms) — a consumer policy for card purchases, not an API
    operation. A settled x402 transfer is one-way. The Clearing House task lifecycle (open → awarded → settled)
    exposes no cancel or reject step in the documented endpoints. Grade is therefore none for the API writes;
    nothing below asserts a window the provider has not written down.
  write_surfaces:
  - operation: post_market_award (POST /market/award, $0.09)
    action: Award a task to a bid; returns the winner's direct payment details
    reversal: none documented
    window: null
    grade: none
  - operation: post_market_receipts (POST /market/receipts, $0.09)
    action: Publish a public, chain-verified receipt (tx hash verified on Base)
    reversal: none documented — a published receipt is public record
    window: null
    grade: none
  - operation: post_directory_list (POST /directory/list, $1)
    action: List an x402 endpoint in the public Agent Exchange directory
    reversal: none documented (no delist route)
    window: null
    grade: none
  - operation: post_notary (POST /notary, $0.10)
    action: Timestamp and SHA-256 a JSON payload
    reversal: not applicable by design — a timestamp receipt cannot be un-issued
    grade: na
  - operation: get_agents_lounge (GET /agents/lounge, $0.09)
    action: Publish a 24-hour agent presence in the wallet lounge
    reversal: none; the presence expires on its own after 24 hours (stated in the planets skill and tool description)
    window: 24 hours (expiry, not a reversal window)
    grade: none
  - operation: get_buy_credits (GET /buy/credits, $19)
    action: Buy a 1,000-call API key in USDC
    reversal: none documented for the USDC purchase; card plans say "Cancel any time" for the subscription
    grade: none
  - operation: Agent Planets — POST /api/claim, terraform, build, post_offer, accept_offer ($0.05)
    action: Claim a planet, mutate it, post or accept a Market Square offer
    reversal: none documented (no release/abandon/withdraw route in the OpenAPI or MCP tools)
    grade: none
  - operation: Clearing House — POST /tasks (0.05 USDC toll), /tasks/{id}/bids, /tasks/{id}/award, /tasks/{id}/receipt
    action: Post, bid, award, publish receipt
    reversal: none documented; llms.txt lists no cancel/withdraw endpoint
    grade: none
  - operation: all GET data reads, POST /search, POST /check, LLM inference and proxy routes
    action: One-shot paid reads with no durable state on the provider
    reversal: na — nothing to reverse; the USDC transfer is final
    grade: na
  - operation: the x402 payment on every call
    action: Transfer USDC to 0xc91cE6291eDC0713ec753BAFBA002506ffb2b95c (Base) or 2147pBT4LxoszjvLeGRxyVzpRnMi986VH3FAoprSs8Ez (Solana)
    reversal: none — the provider's only stated commitment is that an oracle 503 cancels settlement before it completes
    grade: none
