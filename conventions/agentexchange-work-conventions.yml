api_style: REST over HTTPS; query parameters on GET (62 of 86 operations), JSON bodies on the 20 POST routes described in prose; JSON responses with an inline per-operation shape; no shared envelope
auth:
  style: >-
    Payment in place of authentication. No account, no API key and no OAuth by default: an unpaid call to a
    paid route returns HTTP 402 with an x402 challenge, the caller signs a USDC authorization on Base
    (EIP-3009) or Solana (SPL) and retries with X-PAYMENT (x402 v1) or PAYMENT-SIGNATURE (x402 v2); settlement
    is through the Coinbase CDP facilitator. Optionally a card-bought key (Authorization: Bearer ak_… or
    X-API-Key) unlocks every route over plain HTTPS. Over MCP the signed payload travels in an x_payment tool
    argument. Voluntary integration headers (x-agent-store-client, x-agent-store-install-id,
    x-agent-store-referrer) identify an installed integration for attribution only.
  detail: authentication/agentexchange-work-authentication.yml
idempotency:
  supported: false
  coverage: none
  mechanism: null
  header: null
  scope: []
  retention: null
  description: >-
    No Idempotency-Key header, parameter or body field exists on any operation (0 occurrences of "idempot" in
    the spec) and none is documented. The surface is overwhelmingly read-only — 66 GET reads and 12 POST
    inference/proxy calls are naturally repeatable but each repeat is a separate x402 payment — and the
    state-creating writes (POST /market/award, /market/receipts, /directory/list, /directory/index, /notary,
    /check, the /agents/lounge check-in, planets claim/terraform/build/post_offer/accept_offer) carry no replay
    protection: a retried award or directory listing is a second paid request and, for the notary, a second
    timestamped receipt. The payment leg has its own replay protection by construction (an EIP-3009
    authorization carries a nonce and a validity window), but that protects the transfer, not the operation.
  gaps:
  - No idempotency key on the paid writes (market_award $0.09, market_publish_receipt $0.09, post_directory_list $1, post_notary $0.10).
  - No documented safe-retry guidance for an ambiguous outcome (timeout after payment); the only stated protection is on the Gatekeeper Oracle, where a 503 cancels settlement.
